<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b84a27" />
  <title>家庭旅遊離線電子手帳</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg-paper: #fbf5ea;
      --bg-card: #fffdf9;
      --bg-soft: #f7ebd9;
      --ink-main: #3e2f26;
      --ink-muted: #7c685a;
      --maple-deep: #b84a27;
      --maple-warm: #d96b34;
      --milk-tea: #f2e2ca;
      --line-dash: #dec5a4;
      --border-soft: #e6d2b5;
      --stamp-red: #c8372d;
      --ok-bg: #e7f4ea;
      --ok-text: #246b3c;
      --warn-bg: #fdeaea;
      --warn-text: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-paper);
      color: var(--ink-main);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    body {
      padding-bottom: 84px;
    }

    .app-header {
      background: linear-gradient(135deg, #b84a27 0%, #d46532 100%);
      color: #fffaf2;
      padding: 14px 16px 12px;
      border-bottom: 2px dashed rgba(255, 250, 242, 0.45);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .mascot-btn {
      background: #fffaf2;
      border: 2px solid #f5d6b3;
      border-radius: 999px;
      padding: 2px 10px 2px 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(62, 47, 38, 0.18);
      transition: transform 0.16s ease;
    }

    .mascot-btn:active {
      transform: scale(0.92) rotate(-4deg);
    }

    .mascot-quote {
      font-size: 12px;
      font-weight: 700;
      color: var(--maple-deep);
      white-space: nowrap;
    }

    .net-badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #2f7d4a;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .net-badge.offline {
      background: #6f5d52;
    }

    .header-meta {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 250, 242, 0.92);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .banner {
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px dashed var(--line-dash);
      display: none;
    }

    .banner.show {
      display: block;
    }

    .banner.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: #95c9a4;
    }

    .banner.err {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: #e39a95;
    }

    .banner.info {
      background: var(--milk-tea);
      color: var(--ink-main);
    }

    .panel-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(122, 74, 42, 0.05);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    select, input[type="text"], input[type="number"] {
      font-family: inherit;
      font-size: 14px;
      color: var(--ink-main);
      background: #fffaf2;
      border: 1.5px solid var(--line-dash);
      border-radius: 12px;
      padding: 7px 10px;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 999px;
      border: 1.5px solid var(--line-dash);
      background: var(--milk-tea);
      color: var(--ink-main);
      padding: 7px 14px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background: var(--maple-deep);
      color: #fffaf2;
      border-color: var(--maple-deep);
    }

    button.warm {
      background: var(--maple-warm);
      color: #fffaf2;
      border-color: var(--maple-warm);
    }

    button.danger {
      background: #fff3f2;
      color: var(--stamp-red);
      border-color: #e2a49f;
    }

    button.active-pill {
      background: #2f7d4a;
      color: #ffffff;
      border-color: #2f7d4a;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1.5px dashed var(--line-dash);
      padding-top: 10px;
    }

    .stat-chip {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px dashed var(--line-dash);
      color: var(--ink-main);
    }

    .stat-chip.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: #e39a95;
    }

    .stat-chip.note {
      background: #fff3dc;
      color: #8a4b08;
      border-color: #ecc788;
    }

    .itinerary-card {
      position: relative;
      overflow: hidden;
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(122, 74, 42, 0.06);
    }

    .itinerary-card.is-done::after {
      content: "済";
      position: absolute;
      top: 12px;
      right: 14px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 2.5px solid rgba(200, 55, 45, 0.75);
      color: rgba(200, 55, 45, 0.82);
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-14deg);
      background: rgba(200, 55, 45, 0.06);
      pointer-events: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-right: 52px;
      font-size: 13px;
      font-weight: 700;
      color: var(--maple-deep);
    }

    .status-badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--bg-soft);
      color: var(--ink-muted);
      border: 1px solid var(--line-dash);
    }

    .status-badge.done {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: #95c9a4;
    }

    .status-badge.skipped {
      background: #f2ece6;
      color: #7c685a;
    }

    .card-title {
      margin: 6px 0 4px;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink-main);
    }

    .card-sub {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .card-divider {
      border: none;
      border-top: 1.5px dashed var(--line-dash);
      margin: 10px 0;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .override-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: #e8f1fc;
      color: #1d4ed8;
    }

    .alert-box {
      margin-top: 8px;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .editor-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      background: var(--bg-soft);
      border: 1.5px dashed var(--line-dash);
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .editor-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--ink-muted);
    }

    .editor-field input {
      width: 100%;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54px;
      background: #fffdf9;
      border-top: 1.5px solid var(--border-soft);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 999;
      box-shadow: 0 -4px 14px rgba(62, 47, 38, 0.08);
    }

    .nav-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--ink-muted);
      padding: 0 4px;
      font-size: 13px;
      font-weight: 700;
      height: 100%;
    }

    .nav-btn.active {
      color: var(--maple-deep);
      background: var(--milk-tea);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 18px;
      padding: 10px;
      border-top: 1.5px dashed var(--line-dash);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand-group">
        <h1 class="app-title">家庭旅遊離線電子手帳</h1>
        <button type="button" id="mascotBtn" class="mascot-btn" title="點我聽雪之妖精說悄悄話">
          <svg width="26" height="26" viewBox="0 0 36 36" aria-hidden="true">
            <ellipse cx="18" cy="20" rx="11" ry="10" fill="#ffffff" stroke="#5a4336" stroke-width="2" />
            <path d="M9 17 Q18 11 27 17 L25 20 Q18 16 11 20 Z" fill="#5a4336" />
            <circle cx="14.5" cy="18.5" r="1.7" fill="#2b1e16" />
            <circle cx="21.5" cy="18.5" r="1.7" fill="#2b1e16" />
            <polygon points="18,19.5 16.5,22 19.5,22" fill="#e07a3f" />
            <path d="M16 7 L18 10.5 L20 7 L18 8.8 Z" fill="#c8372d" />
          </svg>
          <span id="mascotQuote" class="mascot-quote">啾！今天也要開心賞楓～</span>
        </button>
      </div>
      <span id="netBadge" class="net-badge">線上</span>
    </div>
    <div class="header-meta">
      <span id="metaVersion">底稿版本：尚未同步</span>
      <span id="metaSyncedAt">最後同步：--</span>
      <span id="metaRange">行程：--</span>
    </div>
  </header>

  <main class="container">
    <div id="statusBanner" class="banner"></div>

    <section id="tab-itinerary" class="tab-pane active">
      <div class="panel-card">
        <div class="controls-row">
          <label for="dateSelect" style="font-weight:700;">日期：</label>
          <select id="dateSelect"></select>
          <button type="button" id="weatherBtn">晴雨：☀️ 晴天</button>
          <button type="button" id="stopDayBtn" class="warm">今天就到這裡</button>
        </div>
        <div id="statsRow" class="stats-row"></div>
      </div>
      <div id="scheduleList"></div>
    </section>

    <section id="tab-pocket" class="tab-pane">
      <div class="panel-card">
        <h3 style="margin:0 0 8px;">備選口袋景點</h3>
        <div id="pocketList"></div>
      </div>
    </section>

    <section id="tab-meta" class="tab-pane">
      <div class="panel-card">
        <h3 style="margin:0 0 8px;">住宿與航班資訊</h3>
        <div id="metaList"></div>
      </div>
    </section>

    <section id="tab-settings" class="tab-pane">
      <div class="panel-card">
        <h3 style="margin:0 0 10px;">雲端同步連線設定</h3>
        <div class="editor-field" style="margin-bottom:8px;">
          <label for="gasUrlInput">GAS Web App 網址（/exec）</label>
          <input id="gasUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <div class="editor-field" style="margin-bottom:10px;">
          <label for="apiTokenInput">API_TOKEN</label>
          <input id="apiTokenInput" type="text" placeholder="貼上 API Token" />
        </div>
        <div class="controls-row">
          <button type="button" id="saveConnBtn">儲存連線設定</button>
          <button type="button" id="syncNowBtn" class="primary">立即同步雲端底稿</button>
        </div>
      </div>

      <div class="panel-card">
        <h3 style="margin:0 0 10px;">還原與備份管理</h3>
        <div class="controls-row">
          <button type="button" id="restoreAllBtn" class="danger">全部還原雲端底稿</button>
          <button type="button" id="exportBackupBtn">匯出備份 JSON</button>
          <button type="button" id="importBackupBtn">匯入備份 JSON</button>
          <input id="importFileInput" type="file" accept="application/json" style="display:none;" />
        </div>
      </div>

      <div class="panel-card">
        <h3 style="margin:0 0 8px;">已移除項目歷史紀錄（removed_history）</h3>
        <div id="removedHistoryList"></div>
      </div>
    </section>

    <div class="footer-note">🍁 京都大阪秋楓手帳 · 離線優先運作中</div>
  </main>

  <nav class="bottom-nav" aria-label="主導覽">
    <button type="button" class="nav-btn active" data-tab="itinerary">每日行程</button>
    <button type="button" class="nav-btn" data-tab="pocket">備選口袋</button>
    <button type="button" class="nav-btn" data-tab="meta">住宿航班</button>
    <button type="button" class="nav-btn" data-tab="settings">設定備份</button>
  </nav>

  <script src="./idbStore.js"></script>
  <script src="./syncService.js"></script>
  <script src="./scheduleEngine.js"></script>
  <script>
    (() => {
      const bannerEl = document.getElementById('statusBanner');
      function showBanner(type, msg) {
        if (!bannerEl) return;
        bannerEl.className = 'banner show ' + type;
        bannerEl.textContent = msg;
      }

      window.addEventListener('error', (ev) => {
        showBanner('err', '前端腳本錯誤：' + (ev.message || '未知錯誤'));
      });
      window.addEventListener('unhandledrejection', (ev) => {
        const reason = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason || 'Promise 錯誤');
        showBanner('err', '非同步錯誤：' + reason);
      });

      const quotes = [
        '啾！今天也要開心賞楓～',
        '帶好相機跟保暖外套了嗎？',
        '走累了就慢慢散步，不趕路！',
        '離線也能看行程，安心出發！',
        '下午來杯熱茶或點心吧～'
      ];
      let quoteIdx = 0;
      const mascotBtn = document.getElementById('mascotBtn');
      const mascotQuote = document.getElementById('mascotQuote');
      if (mascotBtn && mascotQuote) {
        mascotBtn.addEventListener('click', () => {
          quoteIdx = (quoteIdx + 1) % quotes.length;
          mascotQuote.textContent = quotes[quoteIdx];
        });
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      const netBadge = document.getElementById('netBadge');
      function updateNetBadge() {
        const online = navigator.onLine;
        netBadge.textContent = online ? '線上' : '離線';
        netBadge.classList.toggle('offline', !online);
      }
      window.addEventListener('online', updateNetBadge);
      window.addEventListener('offline', updateNetBadge);
      updateNetBadge();

      const navBtns = document.querySelectorAll('.nav-btn');
      const panes = document.querySelectorAll('.tab-pane');
      function switchTab(target) {
        navBtns.forEach((b) => b.classList.toggle('active', b.getAttribute('data-tab') === target));
        panes.forEach((p) => p.classList.toggle('active', p.id === 'tab-' + target));
      }
      navBtns.forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
      });

      if (!window.TripIdbStore || !window.TripScheduleEngine) {
        showBanner('err', '找不到 idbStore.js 或 scheduleEngine.js，請確認檔案路徑與載入順序。');
        return;
      }

      const dateSelect = document.getElementById('dateSelect');
      const weatherBtn = document.getElementById('weatherBtn');
      const stopDayBtn = document.getElementById('stopDayBtn');
      const statsRow = document.getElementById('statsRow');
      const scheduleList = document.getElementById('scheduleList');
      const pocketList = document.getElementById('pocketList');
      const metaList = document.getElementById('metaList');
      const removedHistoryList = document.getElementById('removedHistoryList');

      let currentDate = '';
      let editingActivityId = null;

      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function refreshAll(preferredDate) {
        const baseline = await TripIdbStore.getBaseline();
        const metaVerEl = document.getElementById('metaVersion');
        const metaSyncEl = document.getElementById('metaSyncedAt');
        const metaRangeEl = document.getElementById('metaRange');

        if (!baseline || !baseline.data) {
          metaVerEl.textContent = '底稿版本：尚未同步';
          metaSyncEl.textContent = '最後同步：--';
          metaRangeEl.textContent = '行程：--';
          dateSelect.innerHTML = '';
          statsRow.innerHTML = '';
          scheduleList.innerHTML = '<div class="panel-card">尚未同步雲端底稿，請切至下方「設定備份」輸入網址與 Token 並同步。</div>';
          pocketList.innerHTML = '';
          metaList.innerHTML = '';
          await renderRemovedHistory();
          return;
        }

        const m = baseline.data.meta || {};
        metaVerEl.textContent = '底稿版本：' + (m.dataVersion || '--');
        metaSyncEl.textContent = '最後同步：' + (baseline.syncedAt || m.exportedAt || '--');
        metaRangeEl.textContent = '行程：' + (m.tripStartDate || '--') + ' ~ ' + (m.tripEndDate || '--');

        const dates = Array.from(new Set((baseline.data.itinerary || []).map((r) => r.trip_date).filter(Boolean))).sort();
        if (preferredDate && dates.includes(preferredDate)) {
          currentDate = preferredDate;
        } else if (!currentDate || !dates.includes(currentDate)) {
          currentDate = dates[0] || '';
        }

        dateSelect.innerHTML = dates.map((d, i) =>
          `<option value="${escapeHtml(d)}" ${d === currentDate ? 'selected' : ''}>${escapeHtml(d)} ( Day ${i + 1} )</option>`
        ).join('');

        await renderDay(currentDate);
        renderPocket(baseline.data.pocket_spots || []);
        renderTripMeta(baseline.data.trip_meta || []);
        await renderRemovedHistory();
      }

      async function renderDay(dateStr) {
        if (!dateStr) {
          scheduleList.innerHTML = '';
          statsRow.innerHTML = '';
          return;
        }

        const sched = await TripScheduleEngine.buildDaySchedule(dateStr);
        const weather = await TripIdbStore.getDayWeather(dateStr);
        const stopped = await TripIdbStore.getDayStopped(dateStr);

        weatherBtn.textContent = weather === 'rain' ? '晴雨：🌧️ 雨天' : '晴雨：☀️ 晴天';
        stopDayBtn.textContent = stopped ? '已收工（點此恢復顯示）' : '今天就到這裡';
        stopDayBtn.classList.toggle('active-pill', Boolean(stopped));

        const items = sched.items || [];
        const total = items.length;
        const doneCount = items.filter((x) => x.status === 'done').length;
        const skippedCount = items.filter((x) => x.status === 'skipped').length;
        const pendingCount = items.filter((x) => x.status === 'pending').length;
        const overdueCount = items.filter((x) => x.isOverdue).length;

        let chipsHtml = `
          <span class="stat-chip">總站數：${total}</span>
          <span class="stat-chip">已完成：${doneCount}</span>
          <span class="stat-chip">已跳過：${skippedCount}</span>
          <span class="stat-chip">待執行：${pendingCount}</span>
        `;
        if (overdueCount > 0) {
          chipsHtml += `<span class="stat-chip warn">逾時警示：${overdueCount}</span>`;
        }
        if (stopped) {
          chipsHtml += `<span class="stat-chip note">已啟用「今天就到這裡」（未執行維持 pending）</span>`;
        }
        statsRow.innerHTML = chipsHtml;

        if (!items.length) {
          scheduleList.innerHTML = '<div class="panel-card">當日尚無符合條件的行程。</div>';
          return;
        }

        scheduleList.innerHTML = items.map((item) => {
          const isDone = item.status === 'done';
          const statusText = isDone ? '已完成' : (item.status === 'skipped' ? '已跳過' : '待執行');
          const statusCls = isDone ? 'done' : (item.status === 'skipped' ? 'skipped' : '');
          const nextTimeStr = item.nextDepartureTime ? ` → 下一站 ${escapeHtml(item.nextDepartureTime)}` : '';
          const travelInfo = (item.travel_min || item.buffer_min)
            ? `（${escapeHtml(item.transport_mode || '移動')} ${item.travel_min || 0}m + 緩衝 ${item.buffer_min || 0}m）`
            : '';

          const ovKeys = Object.keys(item.overrideFields || {});
          const ovBadge = ovKeys.length
            ? `<div class="override-tag">已微調：${escapeHtml(ovKeys.join(', '))}</div>`
            : '';

          const anchorAlert = item.anchorMissing
            ? `<div class="alert-box">⚠️ 原插入錨點已不存在，已改接於當日末端</div>`
            : '';

          const overdueAlert = item.isOverdue
            ? `<div class="alert-box">⏰ 推算時間已超過固定截止時間（${escapeHtml(item.deadline_time)}）</div>`
            : '';

          const editorHtml = editingActivityId === item.activity_id ? `
            <div class="editor-box">
              <div class="editor-grid">
                <div class="editor-field">
                  <label>停留分鐘 (dwell_min)</label>
                  <input type="number" id="ed_dwell_${escapeHtml(item.activity_id)}" value="${escapeHtml(item.dwell_min)}" min="0" />
                </div>
                <div class="editor-field">
                  <label>交通分鐘 (travel_min)</label>
                  <input type="number" id="ed_travel_${escapeHtml(item.activity_id)}" value="${escapeHtml(item.travel_min)}" min="0" />
                </div>
                <div class="editor-field">
                  <label>隨手備註 (note)</label>
                  <input type="text" id="ed_note_${escapeHtml(item.activity_id)}" value="${escapeHtml(item.note || '')}" />
                </div>
              </div>
              <div class="card-actions">
                <button type="button" class="primary" onclick="window.__saveOverride('${escapeHtml(item.activity_id)}', '${escapeHtml(dateStr)}')">儲存本機微調</button>
                <button type="button" onclick="window.__clearOverride('${escapeHtml(item.activity_id)}', '${escapeHtml(dateStr)}')">還原此站微調</button>
                <button type="button" onclick="window.__closeEditor()">取消</button>
              </div>
            </div>
          ` : '';

          return `
            <article class="itinerary-card${isDone ? ' is-done' : ''}">
              <div class="card-top">
                <span>${escapeHtml(item.start_time || '')} ~ ${escapeHtml(item.end_time || '')}（停留 ${escapeHtml(item.dwell_min)} 分）${nextTimeStr} ${travelInfo}</span>
                <span class="status-badge ${statusCls}">${statusText}</span>
              </div>
              <h3 class="card-title">${escapeHtml(item.title_zh || '')}</h3>
              <div class="card-sub">${escapeHtml(item.title_jp || '')}${item.area ? ' | ' + escapeHtml(item.area) : ''}</div>
              ${item.address_jp ? `<div class="card-sub">地址：${escapeHtml(item.address_jp)}</div>` : ''}
              ${item.note ? `<hr class="card-divider" /><div class="card-sub">備註：${escapeHtml(item.note)}</div>` : ''}
              ${ovBadge}
              ${anchorAlert}
              ${overdueAlert}
              <div class="card-actions">
                <button type="button" class="${isDone ? 'active-pill' : ''}" onclick="window.__setStatus('${escapeHtml(item.activity_id)}', 'done', '${escapeHtml(dateStr)}')">完成</button>
                <button type="button" onclick="window.__setStatus('${escapeHtml(item.activity_id)}', 'skipped', '${escapeHtml(dateStr)}')">跳過</button>
                <button type="button" onclick="window.__setStatus('${escapeHtml(item.activity_id)}', 'pending', '${escapeHtml(dateStr)}')">改待執行</button>
                <button type="button" onclick="window.__toggleEditor('${escapeHtml(item.activity_id)}')">微調／單欄還原</button>
              </div>
              ${editorHtml}
            </article>
          `;
        }).join('');
      }

      function renderPocket(spots) {
        if (!spots.length) {
          pocketList.innerHTML = '<div class="card-sub">目前無備選口袋景點。</div>';
          return;
        }
        pocketList.innerHTML = spots.map((s) => `
          <div class="itinerary-card">
            <div class="card-top">
              <span>${escapeHtml(s.area || '')} · ${escapeHtml(s.indoor_outdoor || '')}</span>
              <span>預設停留 ${escapeHtml(s.default_dwell_min)} 分</span>
            </div>
            <h4 class="card-title">${escapeHtml(s.title_zh || '')}</h4>
            ${s.note ? `<div class="card-sub">備註：${escapeHtml(s.note)}</div>` : ''}
            <div class="card-actions">
              <button type="button" class="primary" onclick="window.__insertPocket('${escapeHtml(s.pocket_id)}')">插入本日行程</button>
            </div>
          </div>
        `).join('');
      }

      function renderTripMeta(rows) {
        if (!rows.length) {
          metaList.innerHTML = '<div class="card-sub">尚無住宿或航班紀錄。</div>';
          return;
        }
        metaList.innerHTML = rows.map((m) => `
          <div class="itinerary-card">
            <div class="card-top">
              <span>${escapeHtml(m.category || '')} ${m.trip_date ? '· ' + escapeHtml(m.trip_date) : ''}</span>
              <span>${escapeHtml(m.status || '')}</span>
            </div>
            <h4 class="card-title">${escapeHtml(m.title_zh || '')}</h4>
            ${m.detail ? `<div class="card-sub">${escapeHtml(m.detail)}</div>` : ''}
          </div>
        `).join('');
      }

      async function renderRemovedHistory() {
        const list = await TripIdbStore.getRemovedHistory();
        if (!list || !list.length) {
          removedHistoryList.innerHTML = '<div class="card-sub">目前無已移除且曾微調的歷史紀錄。</div>';
          return;
        }
        removedHistoryList.innerHTML = list.map((r) => `
          <div class="itinerary-card">
            <div class="card-top">
              <span>${escapeHtml(r.trip_date || '')} · ${escapeHtml(r.activity_id || '')}</span>
              <span>${escapeHtml(r.removedAt || '')}</span>
            </div>
            <div class="card-title">${escapeHtml(r.title_zh || '(未命名活動)')}</div>
            <div class="card-sub">本機微調紀錄：${escapeHtml(JSON.stringify(r.overrideFields || {}))}</div>
          </div>
        `).join('');
      }

      window.__setStatus = async (activityId, status, dateStr) => {
        await TripIdbStore.setActivityStatus(activityId, status, { trip_date: dateStr });
        await renderDay(dateStr);
      };

      window.__toggleEditor = async (activityId) => {
        editingActivityId = editingActivityId === activityId ? null : activityId;
        await renderDay(currentDate);
      };

      window.__closeEditor = async () => {
        editingActivityId = null;
        await renderDay(currentDate);
      };

      window.__saveOverride = async (activityId, dateStr) => {
        const dwellVal = Number(document.getElementById('ed_dwell_' + activityId).value);
        const travelVal = Number(document.getElementById('ed_travel_' + activityId).value);
        const noteVal = document.getElementById('ed_note_' + activityId).value;
        const patch = { note: noteVal };
        if (Number.isFinite(dwellVal) && dwellVal >= 0) patch.dwell_min = Math.floor(dwellVal);
        if (Number.isFinite(travelVal) && travelVal >= 0) patch.travel_min = Math.floor(travelVal);
        await TripIdbStore.setFieldOverrides(activityId, dateStr, patch);
        editingActivityId = null;
        await renderDay(dateStr);
        showBanner('ok', '已儲存本機微調');
      };

      window.__clearOverride = async (activityId, dateStr) => {
        await TripIdbStore.clearFieldOverrides(activityId);
        editingActivityId = null;
        await renderDay(dateStr);
        showBanner('info', '已還原此站本機微調');
      };

      window.__insertPocket = async (pocketId) => {
        if (!currentDate) return;
        const baseline = await TripIdbStore.getBaseline();
        const spot = ((baseline && baseline.data && baseline.data.pocket_spots) || []).find((x) => x.pocket_id === pocketId);
        if (!spot) return;
        await TripScheduleEngine.insertPocketSpot(currentDate, spot, 'END');
        switchTab('itinerary');
        await renderDay(currentDate);
        showBanner('ok', `已將「${spot.title_zh}」插入 ${currentDate}`);
      };

      dateSelect.addEventListener('change', async () => {
        currentDate = dateSelect.value;
        editingActivityId = null;
        await renderDay(currentDate);
      });

      weatherBtn.addEventListener('click', async () => {
        if (!currentDate) return;
        const cur = await TripIdbStore.getDayWeather(currentDate);
        await TripIdbStore.setDayWeather(currentDate, cur === 'rain' ? 'sun' : 'rain');
        await renderDay(currentDate);
      });

      stopDayBtn.addEventListener('click', async () => {
        if (!currentDate) return;
        const cur = await TripIdbStore.getDayStopped(currentDate);
        await TripIdbStore.setDayStopped(currentDate, !cur);
        await renderDay(currentDate);
      });

      const gasUrlInput = document.getElementById('gasUrlInput');
      const apiTokenInput = document.getElementById('apiTokenInput');

      async function loadConnSettings() {
        if (typeof TripIdbStore.getSyncConfig === 'function') {
          const cfg = await TripIdbStore.getSyncConfig();
          if (cfg) {
            gasUrlInput.value = cfg.url || '';
            apiTokenInput.value = cfg.token || '';
          }
        }
      }

      document.getElementById('saveConnBtn').addEventListener('click', async () => {
        if (typeof TripIdbStore.setSyncConfig === 'function') {
          await TripIdbStore.setSyncConfig({
            url: gasUrlInput.value.trim(),
            token: apiTokenInput.value.trim()
          });
          showBanner('ok', '已儲存連線設定');
        } else {
          showBanner('err', 'idbStore.js 缺少 setSyncConfig 方法');
        }
      });

      document.getElementById('syncNowBtn').addEventListener('click', async () => {
        if (!window.TripSyncService || typeof TripSyncService.syncNow !== 'function') {
          showBanner('err', '找不到 TripSyncService.syncNow');
          return;
        }
        if (typeof TripIdbStore.setSyncConfig === 'function') {
          await TripIdbStore.setSyncConfig({
            url: gasUrlInput.value.trim(),
            token: apiTokenInput.value.trim()
          });
        }
        showBanner('info', '正在同步雲端底稿...');
        const res = await TripSyncService.syncNow();
        if (res && res.ok) {
          await refreshAll(currentDate);
          showBanner('ok', '已同步最新雲端底稿');
        } else {
          showBanner('err', '同步失敗：' + (res && res.message ? res.message : '未知錯誤'));
        }
      });

      document.getElementById('restoreAllBtn').addEventListener('click', async () => {
        if (!confirm('確定要全部還原雲端底稿嗎？本機微調、狀態、晴雨與插入景點將清除，底稿與移除歷史會保留。')) return;
        await TripScheduleEngine.restoreAllToBaseline();
        editingActivityId = null;
        await refreshAll(currentDate);
        showBanner('ok', '已全部還原至雲端底稿');
      });

      document.getElementById('exportBackupBtn').addEventListener('click', async () => {
        const pack = await TripIdbStore.exportAllBackup();
        const blob = new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kyoto-osaka-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showBanner('ok', '已匯出備份 JSON');
      });

      const importFileInput = document.getElementById('importFileInput');
      document.getElementById('importBackupBtn').addEventListener('click', () => {
        importFileInput.value = '';
        importFileInput.click();
      });

      importFileInput.addEventListener('change', async (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const res = await TripIdbStore.importAllBackup(parsed);
          if (res && res.ok) {
            await refreshAll(currentDate);
            showBanner('ok', '已匯入備份檔');
          } else {
            showBanner('err', '匯入已拒絕（未覆蓋原有資料）：' + (res && res.message ? res.message : '格式無效'));
          }
        } catch (err) {
          showBanner('err', '匯入已拒絕（未覆蓋原有資料）：JSON 解析失敗');
        }
      });

      loadConnSettings().then(() => refreshAll());
    })();
  </script>
</body>
</html>
