<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 京都大阪家庭旅遊手帳</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1e242b;
      --muted: #5c6672;
      --accent: #2c5e4f;
      --accent-soft: #e6f0ec;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --late: #b91c1c;
      --late-bg: #fee2e2;
      --border: #dfe4e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .day-start-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .badge.manual {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main {
      max-width: 820px;
      margin: 16px auto;
      padding: 0 14px 64px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card.skipped { opacity: 0.55; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .tag-wait {
      background: var(--warn-bg);
      color: var(--warn);
      padding: 1px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-late {
      background: var(--late-bg);
      color: var(--late);
      padding: 1px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .panel {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: none;
    }
    .panel.open { display: block; }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <strong>2027 京都大阪家庭旅遊手帳</strong>
      <input type="date" id="tripDateInput" value="2027-11-26" style="width:auto;" />
    </div>
    <div class="day-start-bar">
      <label for="dayStartInput" style="margin:0; font-size:13px; color:var(--ink);">⏰ 今日出發</label>
      <input type="time" id="dayStartInput" style="width:auto;" />
      <button type="button" class="btn" id="resetDayStartBtn">恢復預設</button>
      <span id="dayStartStatus" class="badge">依循底稿起算</span>
    </div>
    <div class="day-start-bar" style="margin-top:6px;">
      <label for="settingsDefaultStartInput" style="margin:0; font-size:12px; color:var(--muted);">⚙️ 設定頁預設出發</label>
      <input type="time" id="settingsDefaultStartInput" style="width:auto;" />
    </div>
  </header>

  <main id="scheduleContainer"></main>

  <script src="./scheduleEngine.js"></script>
  <script>
    const SETTINGS_DEFAULT_START_KEY = "kyoto2027_default_day_start";

    function readSettingsDefaultStart() {
      try {
        const v = localStorage.getItem(SETTINGS_DEFAULT_START_KEY);
        return ScheduleEngine.isValidHHMM(v) ? v.trim() : ScheduleEngine.DEFAULT_FALLBACK_START;
      } catch (_) {
        return ScheduleEngine.DEFAULT_FALLBACK_START;
      }
    }

    function writeSettingsDefaultStart(hhmm) {
      if (!ScheduleEngine.isValidHHMM(hhmm)) return;
      try {
        localStorage.setItem(SETTINGS_DEFAULT_START_KEY, hhmm.trim());
      } catch (_) {}
    }

    const state = {
      settingsDefaultStart: readSettingsDefaultStart(),
      runtimeState: {},
      localOverrides: {},
      extraByDate: {},
      baseByDate: {
        "2027-11-26": [
          { activity_id: "ACT-0011", title_zh: "渡月橋與桂川河畔晨間散步", area: "嵐山", start_time: "08:30", time_type: "彈性", dwell_min: 60, travel_min: 10, buffer_min: 5, transport_mode: "步行", note: "避開人潮拍攝晨景" },
          { activity_id: "ACT-0013", title_zh: "嵐山祐齋亭預約賞楓", area: "嵐山", start_time: "10:00", time_type: "固定抵達", dwell_min: 60, travel_min: 15, buffer_min: 10, transport_mode: "步行", note: "需事先官網預約" }
        ]
      }
    };

    const dateEl = document.getElementById("tripDateInput");
    const dayStartEl = document.getElementById("dayStartInput");
    const settingsDefaultStartEl = document.getElementById("settingsDefaultStartInput");
    const resetBtn = document.getElementById("resetDayStartBtn");
    const statusEl = document.getElementById("dayStartStatus");
    const containerEl = document.getElementById("scheduleContainer");

    let extraSeq = 1;

    function getCurrentDate() {
      return dateEl.value || "2027-11-26";
    }

    function render() {
      const tripDate = getCurrentDate();
      const baseItems = state.baseByDate[tripDate] || [];
      const extraItems = state.extraByDate[tripDate] || [];
      const settingsDefaultStart = readSettingsDefaultStart();
      state.settingsDefaultStart = settingsDefaultStart;
      settingsDefaultStartEl.value = settingsDefaultStart;

      const computed = ScheduleEngine.computeDaySchedule({
        tripDate,
        baseItems,
        extraItems,
        localOverrides: state.localOverrides,
        runtimeState: state.runtimeState,
        settingsDefaultStart: settingsDefaultStart
      });

      dayStartEl.value = computed.dayStartHHMM;
      if (computed.isManualDayStart) {
        statusEl.textContent = "已手動調整（" + computed.dayStartHHMM + "）";
        statusEl.className = "badge manual";
      } else if (computed.dayStartSource === "baseline_first_item") {
        statusEl.textContent = "依循底稿起算（" + computed.dayStartHHMM + "）";
        statusEl.className = "badge";
      } else {
        statusEl.textContent = "設定頁預設（" + computed.settingsDefaultHHMM + "）";
        statusEl.className = "badge";
      }

      containerEl.innerHTML = "";
      computed.items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card" + (item.skipped ? " skipped" : "");

        const originTag = item._origin === "extra" ? '<span class="badge">臨時加點</span>' : "";
        const waitTag = item.wait_min > 0 ? '<span class="tag-wait">提早到・等待 ' + item.wait_min + ' 分</span>' : "";
        const lateTag = item.is_late ? '<span class="tag-late">逾時提醒</span>' : "";
        const startOvNote = item.has_start_override ? "（已微調開始時間）" : "";

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong>${item.computed_start}${item.computed_end ? " – " + item.computed_end : ""}｜${escapeHtml(item.title_zh || "")}</strong>
            <div>${originTag} ${waitTag} ${lateTag}</div>
          </div>
          <div class="meta-row">
            <span>區域：${escapeHtml(item.area || "-")}</span>
            <span>性質：${escapeHtml(item.time_type || "彈性")}</span>
            <span>停留：${item.dwell_min} 分</span>
            <span>下段交通：${escapeHtml(item.transport_mode || "-")}（${item.travel_min} + 緩衝 ${item.buffer_min} 分）</span>
            <span>${startOvNote}</span>
          </div>
          <div class="actions">
            <button type="button" class="btn" data-act="toggle-edit" data-id="${escapeAttr(item.activity_id)}">編輯／還原</button>
            <button type="button" class="btn" data-act="toggle-copy" data-id="${escapeAttr(item.activity_id)}">📋 複製加點</button>
            <button type="button" class="btn" data-act="toggle-skip" data-id="${escapeAttr(item.activity_id)}">${item.skipped ? "取消跳過" : "跳過"}</button>
          </div>

          <div class="panel" id="edit-${escapeAttr(item.activity_id)}">
            <div class="field-grid">
              <div>
                <label>開始時間（留空解除單站時間）</label>
                <input type="time" class="inp-start" value="${escapeAttr(item.effective_start_time || "")}" />
              </div>
              <div>
                <label>停留分鐘</label>
                <input type="number" class="inp-dwell" min="0" value="${item.dwell_min}" />
              </div>
              <div>
                <label>交通分鐘</label>
                <input type="number" class="inp-travel" min="0" value="${item.travel_min}" />
              </div>
              <div>
                <label>交通緩衝（分）</label>
                <input type="number" class="inp-buffer" min="0" value="${item.buffer_min}" />
              </div>
            </div>
            <div class="actions">
              <button type="button" class="btn primary" data-act="save-edit" data-id="${escapeAttr(item.activity_id)}">儲存本機微調</button>
              <button type="button" class="btn" data-act="clear-start" data-id="${escapeAttr(item.activity_id)}">清空開始時間</button>
              <button type="button" class="btn" data-act="reset-card" data-id="${escapeAttr(item.activity_id)}">還原底稿值</button>
            </div>
          </div>

          <div class="panel" id="copy-${escapeAttr(item.activity_id)}">
            <div class="field-grid">
              <div>
                <label>插入位置</label>
                <select class="sel-placement">
                  <option value="before">插在本站前</option>
                  <option value="after">插在本站後</option>
                </select>
              </div>
              <div>
                <label>新站點名稱</label>
                <input type="text" class="inp-title" value="${escapeAttr((item.title_zh || "") + "（加點）")}" />
              </div>
              <div>
                <label>停留分鐘</label>
                <input type="number" class="inp-ex-dwell" min="0" value="30" />
              </div>
              <div>
                <label>交通分鐘</label>
                <input type="number" class="inp-ex-travel" min="0" value="10" />
              </div>
            </div>
            <div class="actions">
              <button type="button" class="btn primary" data-act="confirm-copy" data-id="${escapeAttr(item.activity_id)}">確認加入</button>
            </div>
          </div>
        `;
        containerEl.appendChild(card);
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(s) {
      return escapeHtml(s);
    }

    settingsDefaultStartEl.addEventListener("change", () => {
      if (ScheduleEngine.isValidHHMM(settingsDefaultStartEl.value)) {
        writeSettingsDefaultStart(settingsDefaultStartEl.value);
        render();
      }
    });

    dayStartEl.addEventListener("change", () => {
      const tripDate = getCurrentDate();
      if (ScheduleEngine.isValidHHMM(dayStartEl.value)) {
        state.runtimeState["start:" + tripDate] = {
          time: dayStartEl.value,
          manual: true,
          updatedAt: new Date().toISOString()
        };
        render();
      }
    });

    resetBtn.addEventListener("click", () => {
      const tripDate = getCurrentDate();
      delete state.runtimeState["start:" + tripDate];
      render();
    });

    dateEl.addEventListener("change", render);

    containerEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const act = btn.getAttribute("data-act");
      const id = btn.getAttribute("data-id");
      const tripDate = getCurrentDate();

      if (act === "toggle-edit") {
        document.getElementById("edit-" + id)?.classList.toggle("open");
      } else if (act === "toggle-copy") {
        document.getElementById("copy-" + id)?.classList.toggle("open");
      } else if (act === "toggle-skip") {
        const cur = state.localOverrides[id] || { fields: {} };
        const nextSkipped = !cur.skipped;
        state.localOverrides[id] = { ...cur, skipped: nextSkipped };
        render();
      } else if (act === "save-edit") {
        const panel = document.getElementById("edit-" + id);
        const startVal = panel.querySelector(".inp-start").value.trim();
        const dwellVal = Number(panel.querySelector(".inp-dwell").value || 0);
        const travelVal = Number(panel.querySelector(".inp-travel").value || 0);
        const bufferVal = Number(panel.querySelector(".inp-buffer").value || 0);

        state.localOverrides[id] = {
          activity_id: id,
          trip_date: tripDate,
          fields: {
            start_time: startVal,
            dwell_min: dwellVal,
            travel_min: travelVal,
            buffer_min: bufferVal
          },
          updatedAt: new Date().toISOString()
        };
        render();
      } else if (act === "clear-start") {
        const existing = state.localOverrides[id] || { activity_id: id, trip_date: tripDate, fields: {} };
        state.localOverrides[id] = {
          ...existing,
          fields: { ...(existing.fields || {}), start_time: "" },
          updatedAt: new Date().toISOString()
        };
        render();
      } else if (act === "reset-card") {
        delete state.localOverrides[id];
        render();
      } else if (act === "confirm-copy") {
        const panel = document.getElementById("copy-" + id);
        const placement = panel.querySelector(".sel-placement").value === "before" ? "before" : "after";
        const titleZh = panel.querySelector(".inp-title").value.trim() || "新增站點";
        const dwellMin = Number(panel.querySelector(".inp-ex-dwell").value || 30);
        const travelMin = Number(panel.querySelector(".inp-ex-travel").value || 10);

        const allItems = [...(state.baseByDate[tripDate] || []), ...(state.extraByDate[tripDate] || [])];
        const src = allItems.find((x) => x.activity_id === id) || {};

        state.extraByDate[tripDate] = state.extraByDate[tripDate] || [];
        state.extraByDate[tripDate].push({
          activity_id: "EXTRA-" + Date.now() + "-" + extraSeq,
          trip_date: tripDate,
          title_zh: titleZh,
          area: src.area || "",
          time_type: "彈性",
          dwell_min: dwellMin,
          travel_min: travelMin,
          buffer_min: 5,
          transport_mode: src.transport_mode || "步行",
          note: src.note || "",
          _placement: placement,
          _anchorId: id,
          _insertSeq: extraSeq++,
          _createdAt: new Date().toISOString()
        });
        render();
      }
    });

    render();
  </script>
</body>
</html>
